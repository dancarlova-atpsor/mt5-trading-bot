# ============================================
# Risk Management
# ============================================

position_sizing:
  method: "percent_risk"    # "fixed_lot" sau "percent_risk"
  risk_per_trade: 0.5       # 0.5% per trade = €26 pe cont 5300 EUR
  simulated_balance: 5700   # USD echivalent 5300 EUR — toate calculele lot folosesc asta in loc de balance demo
  max_risk_per_trade_usd: 28  # Cap hard $28 USD risc per trade (~€26)
  fixed_lot: 0.01           # Lot fix (daca method = fixed_lot)
  max_lot: 0.10             # Max 0.10 lot pe cont 5300 EUR (siguranta)

  # Volum fix per simbol (override pe calculul automat)
  volume_overrides:
    XAUUSD.cfd: 0.02        # Aur — volum redus pt cont mic (era 0.05 pe demo $98k)

stop_loss:
  default_pips: 50
  use_atr: true             # SL bazat pe ATR
  atr_multiplier: 1.5
  atr_period: 14

  # Override SL per simbol (pips = incrementi minimi)
  # Pentru simboluri unde vrem SL fix, nu ATR-based
  symbol_overrides: {}     # XAGUSD scos; XAUUSD foloseste ATR*1.5 default (bun)

take_profit:
  risk_reward_ratio: 3.0    # TP = SL * 3 (era 2.0, crescut pt mai mult profit/trade vs comision)
  use_atr: true
  atr_multiplier: 3.0

trailing_stop:
  enabled: true
  activation_pips: 30       # Se activeaza dupa X pips profit
  trail_pips: 15            # Distanta de trailing

limits:
  max_open_positions: 3           # Max 3 pozitii simultan (cont mic)
  max_positions_per_symbol: 1     # Doar 1 pozitie per simbol (evita stacking)
  max_daily_loss_percent: 1.0    # Opreste botul daca pierde 1% azi (~€53 pe 5300)
  max_daily_trades: 3             # Max 3 trade-uri/zi (reduce overtrading)
  max_correlation_exposure: 2    # Max 2 pozitii pe perechi corelate
