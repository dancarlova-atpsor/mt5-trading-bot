# ============================================
# Risk Management
# ============================================

position_sizing:
  method: "percent_risk"    # "fixed_lot" sau "percent_risk"
  risk_per_trade: 0.5       # 0.5% per trade = €26 pe cont 5300 EUR
  simulated_balance: 5700   # USD echivalent 5300 EUR — toate calculele lot folosesc asta in loc de balance demo
  max_risk_per_trade_usd: 28  # Cap hard $28 USD risc per trade (~€26)
  fixed_lot: 0.01           # Lot fix (daca method = fixed_lot)
  max_lot: 0.10             # Max 0.10 lot pe cont 5300 EUR (siguranta)

  # Volum fix per simbol (override pe calculul automat)
  # OIL-ONLY (2026-05-26) — loturi optime din stress test
  volume_overrides:
    BRENT.cfd: 0.08         # MeanRev H1 + Breakout M15, BLOW-UP la 0.09 confirmat
    WTI.cfd:   0.07         # Breakout M15, BLOW-UP la 0.08 confirmat
    # Vechi (scoase):
    # XAUUSD.cfd: 0.02
    # XAGUSD.cfd: 0.01

stop_loss:
  default_pips: 50
  use_atr: true             # SL bazat pe ATR
  atr_multiplier: 1.5
  atr_period: 14

  # Override SL per simbol (pips = incrementi minimi)
  # Pentru simboluri unde vrem SL fix, nu ATR-based
  symbol_overrides: {}     # XAGUSD scos; XAUUSD foloseste ATR*1.5 default (bun)

take_profit:
  risk_reward_ratio: 3.0    # Default R:R = 3.0
  use_atr: true
  atr_multiplier: 3.0
  # Per-symbol R:R override (din backtest 90d 2026-05-07):
  # USDCAD si XAG functioneaza mai bine cu R:R 1.5 (TP atins mai des)
  # AMD stock la fel
  symbol_rr_overrides:
    USDCAD.cfd: 1.5
    XAGUSD.cfd: 1.5
    AMD.cfd: 1.5

trailing_stop:
  enabled: false            # DEZACTIVAT 2026-04-28: prea agresiv pe XAU (30 pips = 30 cents)
                            # ProfitManager tier-based trailing (profit-USD-based) e activ in main.py
  activation_pips: 30
  trail_pips: 15

limits:
  # OIL-ONLY (2026-05-26):
  # BRENT poate avea 2 pozitii simultan (MeanRev H1 + Breakout M15)
  # WTI poate avea 1 pozitie (Breakout M15)
  # Total max activ: 3 (2 BRENT + 1 WTI)
  max_open_positions: 4           # Buffer +1 (era 3)
  max_positions_per_symbol: 2     # BRENT poate avea Breakout + MeanRev simultan (era 1)
  max_daily_loss_percent: 3.0    # 3% (era 2%) — pe oil DD natural mai mare
  max_daily_trades: 8             # Crescut de la 5 (oil produce mai multe semnale)
  max_correlation_exposure: 2    # BRENT-WTI sunt corelate, dar trade-uri pe ambele OK
