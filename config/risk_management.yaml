# ============================================
# Risk Management
# ============================================

position_sizing:
  method: "percent_risk"    # "fixed_lot" sau "percent_risk"
  risk_per_trade: 0.5       # 0.5% per trade = €26 pe cont 5300 EUR
  simulated_balance: 5700   # USD echivalent 5300 EUR — toate calculele lot folosesc asta in loc de balance demo
  max_risk_per_trade_usd: 28  # Cap hard $28 USD risc per trade (~€26)
  fixed_lot: 0.01           # Lot fix (daca method = fixed_lot)
  max_lot: 0.10             # Max 0.10 lot pe cont 5300 EUR (siguranta)

  # Volum fix per simbol (override pe calculul automat)
  # PORTOFOLIU 2026-07-01 — loturi din mass scan (conservator pentru stress test 180d)
  volume_overrides:
    XAGUSD.cfd: 0.01        # Argint — Breakout H1, redus de la 0.02 (BLOW-UP la 0.02 in stress test)
    XAUUSD.cfd: 0.01        # Aur — MeanRev H1, redus preventiv
    XPTUSD.cfd: 0.02        # Platina — MeanRev M30
    XPDUSD.cfd: 0.02        # Paladiu — MeanRev M30
    WTI.cfd:    0.05        # Petrol US — MeanRev M30, redus de la 0.07
    BRENT.cfd:  0.05        # Petrol UK — MeanRev H1 + Breakout M30, redus de la 0.08
    COCOA.cfd:  0.02        # Cacao — Breakout H1
    BNBUSD.cfd: 0.05        # Binance Coin (crypto) — MeanRev M30

stop_loss:
  default_pips: 50
  use_atr: true             # SL bazat pe ATR
  atr_multiplier: 1.5
  atr_period: 14

  # Override SL per simbol (pips = incrementi minimi)
  # Pentru simboluri unde vrem SL fix, nu ATR-based
  symbol_overrides: {}     # XAGUSD scos; XAUUSD foloseste ATR*1.5 default (bun)

take_profit:
  risk_reward_ratio: 3.0    # Default R:R = 3.0
  use_atr: true
  atr_multiplier: 3.0
  # Per-symbol R:R override (din backtest 90d 2026-05-07):
  # USDCAD si XAG functioneaza mai bine cu R:R 1.5 (TP atins mai des)
  # AMD stock la fel
  symbol_rr_overrides:
    USDCAD.cfd: 1.5
    XAGUSD.cfd: 1.5
    AMD.cfd: 1.5

trailing_stop:
  enabled: false            # DEZACTIVAT 2026-04-28: prea agresiv pe XAU (30 pips = 30 cents)
                            # ProfitManager tier-based trailing (profit-USD-based) e activ in main.py
  activation_pips: 30
  trail_pips: 15

limits:
  # PORTOFOLIU 2026-07-01: 8 simboluri, scalat corespunzator
  max_open_positions: 8           # 8 simboluri × 1 pozitie fiecare
  max_positions_per_symbol: 2     # BRENT poate MeanRev H1 + Breakout M30 simultan
  max_daily_loss_percent: 5.0    # 5% cont ($285 pe $5700) — kill-switch global
  max_daily_trades: 20            # 8 simboluri × ~2-3 trade/zi mediu
  max_correlation_exposure: 3    # Metale corelate (XAU/XAG/XPT/XPD), permit 3 simultan

  # NOU 2026-07-01: PER-SIMBOL daily loss limit (izolare per simbol)
  # Cand un simbol pierde X USD intr-o zi → skip DOAR pe acel simbol, restul continua
  per_symbol_daily_loss_usd:
    XAGUSD.cfd: 30              # ~4% cap, blow-up preventiv
    XAUUSD.cfd: 30
    XPTUSD.cfd: 30
    XPDUSD.cfd: 30
    WTI.cfd:    40
    BRENT.cfd:  40
    COCOA.cfd:  25
    BNBUSD.cfd: 30

  # Kill-switch severe (blow-up prevention)
  max_dd_kill_switch_usd: 300    # -$300 total DD (5.3% cont) → OPRIRE TOTALA bot
