# ============================================
# Risk Management
# ============================================

position_sizing:
  method: "percent_risk"    # "fixed_lot" sau "percent_risk"
  risk_per_trade: 0.3       # 0.3% din cont per tranzactie (~$300 risc pe $100k, conservator)
  max_risk_per_trade_usd: 30  # Cap hard $30 USD risc per trade (sub limita zilnica -$53)
  fixed_lot: 0.01           # Lot fix (daca method = fixed_lot)
  max_lot: 0.5              # Lot maxim permis (redus de la 1.0)

  # Volum fix per simbol (override pe calculul automat)
  volume_overrides:
    XAUUSD.cfd: 0.05        # Aur - spread 0, ATR ~13 pips pe H1. Volum mic pt safety.

stop_loss:
  default_pips: 50
  use_atr: true             # SL bazat pe ATR
  atr_multiplier: 1.5
  atr_period: 14

  # Override SL per simbol (pips = incrementi minimi)
  # Pentru simboluri unde vrem SL fix, nu ATR-based
  symbol_overrides: {}     # XAGUSD scos; XAUUSD foloseste ATR*1.5 default (bun)

take_profit:
  risk_reward_ratio: 3.0    # TP = SL * 3 (era 2.0, crescut pt mai mult profit/trade vs comision)
  use_atr: true
  atr_multiplier: 3.0

trailing_stop:
  enabled: true
  activation_pips: 30       # Se activeaza dupa X pips profit
  trail_pips: 15            # Distanta de trailing

limits:
  max_open_positions: 5           # Max 5 pozitii simultan (cate una per simbol)
  max_positions_per_symbol: 1     # Doar 1 pozitie per simbol (evita stacking)
  max_daily_loss_percent: 2.0    # Opreste botul daca pierde 2% azi
  max_daily_trades: 8             # Redus de la 15 — forteaza selectivitate, reduce comisioane
  max_correlation_exposure: 3    # Max pozitii pe perechi corelate
