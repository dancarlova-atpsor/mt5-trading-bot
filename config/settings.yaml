# ============================================
# Trading Bot MT5 — Configurari Generale
# ============================================

account:
  number: 9047351           # Cont demo Earn Broker
  password: ""              # Se seteaza din env var MT5_PASSWORD
  server: "EarnBroker-Sharp ECN"
  mode: "demo"              # "demo" sau "real"
  magic_number: 123456      # ID unic pentru ordinele botului

symbols:
  - EURUSD.cfd
  - GBPUSD.cfd
  - XAUUSD.cfd
  - XAGUSD.cfd
  - US500.cfd

active_strategies:
  - trend_following
  - mean_reversion
  # - scalping              # Decomenteaza cand esti gata

execution:
  mode: "python_api"          # "python_api" | "mql5_ea" | "both"
  mt5_files_path: ""          # Gol = auto-detectare MQL5/Files/
  signal_timeout: 30          # Timeout asteptare confirmare EA (secunde)

schedule:
  check_interval_seconds: 10
  trading_hours: "08:00-22:00"
  timezone: "Europe/Bucharest"

notifications:
  telegram:
    enabled: false            # Seteaza true + env vars pt activare
    bot_token: ""             # Sau env var TELEGRAM_BOT_TOKEN
    chat_id: ""               # Sau env var TELEGRAM_CHAT_ID
    notify_trades: true       # Notificare la fiecare tranzactie
    notify_daily: true        # Raport zilnic automat
    notify_errors: true       # Alerte erori si stop

logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  file: "logs/trading_bot.log"
  max_size_mb: 10
  backup_count: 5
