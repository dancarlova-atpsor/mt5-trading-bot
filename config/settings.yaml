# ============================================
# Trading Bot MT5 — Configurari Generale
# ============================================

account:
  number: 9047479           # Cont demo Earn Broker (creat 2026-04-14)
  password: ""              # Se seteaza din env var MT5_PASSWORD
  server: "EarnBroker-Sharp ECN"
  mode: "demo"              # "demo" sau "real"
  magic_number: 123456      # ID unic pentru ordinele botului

symbols:
  # CONFIG REAL TEST 5300 EUR — 4 simboluri castigatoare confirmate live
  # Scoase: AUDUSD (-$601), EURGBP (-$366), EURUSD (marginal -$6)
  - XAUUSD.cfd       # +$150 net real (13 trades), comision minim $0.10/lot
  - USDCHF.cfd       # marginal pozitiv, swap BUY OK
  - USDCAD.cfd       # bun pe TF cu params 15/70/18
  - GBPUSD.cfd       # doar Breakout

active_strategies:
  - trend_following
  - breakout
  # - news_sentiment        # Dezactivat 2026-04-17: overnight a dus la pierderi
  # - macd_divergence       # Dezactivat: backtest 0-1 trade/simbol, nu produce signal
  # - mean_reversion
  # - scalping

execution:
  mode: "python_api"          # "python_api" | "mql5_ea" | "both"
  mt5_files_path: ""          # Gol = auto-detectare MQL5/Files/
  signal_timeout: 30          # Timeout asteptare confirmare EA (secunde)

schedule:
  check_interval_seconds: 120     # Verifica la 2 min (era 60s — reduce re-entry rapid + comisioane)
  trading_hours: "00:00-23:59"    # 24/24 luni-vineri
  timezone: "Europe/Bucharest"

notifications:
  telegram:
    enabled: true
    bot_token: "8689397349:AAGMYNnNquOkoHepkcIPWm1vs7Xo_g-WO3I"
    chat_id: "8374879733"
    notify_trades: true       # Notificare la fiecare tranzactie
    notify_daily: true        # Raport zilnic automat
    notify_errors: true       # Alerte erori si stop

position_cooldown_seconds: 300    # 5 min cooldown pe simbol dupa close (evita re-entry rapid)

profit_manager:
  trailing_activation_eur: 40     # Activare trailing la +40 EUR (era 30)
  trailing_percent: 30            # Inchide daca profitul scade 30% din maxim
  cycle_target_eur: 150           # Target ciclu +150 EUR (era 100) — let profits run
  cycle_pause_seconds: 300        # Pauza 5 min intre cicluri
  max_daily_profit_eur: 300       # Stop dupa +300 EUR castigati pe zi
  max_daily_loss_eur: 53          # Stop dupa -53 EUR pierduti pe zi (1% din 5324)

news:
  calendar_enabled: true
  blackout_minutes_before: 30   # Nu tranzactiona 30 min inainte de stiri mari
  blackout_minutes_after: 30    # Nu tranzactiona 30 min dupa stiri mari
  high_impact_only: true        # Doar stiri cu impact mare

sentiment:
  enabled: true
  newsapi_key: ""               # Sau env var NEWSAPI_KEY (optional, merge si fara)
  min_score_threshold: 0.3      # Scor minim pt semnal
  check_interval_minutes: 60    # Cat de des verifica stirile

superbot:
  enabled: true                            # Activat 2026-04-14 — deep analysis la 30 min
  deep_analysis_interval_iterations: 30    # 30 × 60s = 30 min
  regime:
    adx_period: 14
    adx_trend_threshold: 25
    atr_period: 14
    bb_period: 20
    volatility_percentile_high: 80
    quiet_percentile_low: 20
  performance:
    window_hours: 24
    min_trades_to_evaluate: 4        # Redus de la 5 — reactie mai rapida la pierderi
    min_win_rate: 40                 # Crescut de la 35 — sta exigent
    disable_hours: 6                 # Crescut de la 4 — lasa piata sa se stabilizeze
    history_file: "logs/superbot/performance.json"
  correlation:
    timeframe: "M15"
    lookback_bars: 120
    max_abs_corr: 0.75
  calibrator:
    regime_size_mult:
      TRENDING: 1.3
      RANGING: 0.7
      VOLATILE: 0.5
      QUIET: 0.0
      UNKNOWN: 0.0
    skip_quiet: true
    low_perf_penalty: 0.7
    min_perf_win_rate: 45

logging:
  level: "INFO"             # DEBUG, INFO, WARNING, ERROR
  file: "logs/trading_bot.log"
  max_size_mb: 10
  backup_count: 5
