# ============================================
# Calendar Earnings Stocks 2026
# ============================================
# Bot evita trade-uri pe stocks cu earnings ±2 zile (configurabil in settings.yaml)
# Update manual la fiecare trimestru. Sursa: Yahoo Finance / NASDAQ.
# Format: YYYY-MM-DD
#
# Cum se aplica:
# - 2 zile inainte: bot NU deschide trade-uri noi pe acel simbol
# - 1 zi dupa earnings: bot inchide pozitia daca exista la 22:00 (cu 1h inainte de close)
# - 2 zile dupa: bot NU deschide trade-uri noi
# - Earnings se anunta DUPA close (afterhours), deci ziua earnings = ziua "T"

