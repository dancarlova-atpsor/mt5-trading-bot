# ============================================
# Parametri per Strategie
# XAUUSD SCOS — swap brutal (-610 USD/lot/zi pe BUY)
# XAGUSD pastrat — swap mic, verificat live pe cont real
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # Profitabil pe: EURUSD(PF1.32), AUDUSD(PF1.32), CADJPY(PF1.32),
  #                XAGUSD(PF1.25), ETHUSD(PF1.26), EURGBP(PF1.12)
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - CADJPY.cfd
    - XAGUSD.cfd
    - ETHUSD.cfd
    - EURGBP.cfd
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14

breakout:
  enabled: true
  timeframe: "H1"
  # Profitabil pe: GBPUSD(PF1.13), AUDJPY(PF1.53), EURJPY(PF1.16),
  #                AUDUSD(PF1.14), US30(PF1.17 — swap mic pe SHORT)
  symbols:
    - GBPUSD.cfd
    - AUDJPY.cfd
    - EURJPY.cfd
    - AUDUSD.cfd
  lookback_period: 20
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 1.2

macd_divergence:
  enabled: true
  timeframe: "H1"
  # Profitabil pe: USDJPY(PF3.80!), GBPJPY(PF2.20), EURCAD(PF3.53 NOU!),
  #                BTCUSD(PF1.99), ETHUSD(PF2.73), EURUSD(PF1.81),
  #                CADJPY(PF1.73), AUDUSD(PF1.50), NZDUSD(PF1.30 NOU!)
  symbols:
    - USDJPY.cfd
    - GBPJPY.cfd
    - EURCAD.cfd
    - BTCUSD.cfd
    - ETHUSD.cfd
    - EURUSD.cfd
    - CADJPY.cfd
    - AUDUSD.cfd
    - NZDUSD.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 40
  rsi_overbought: 60
  divergence_lookback: 30

news_sentiment:
  enabled: true
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - GBPUSD.cfd
    - XAGUSD.cfd
    - BTCUSD.cfd
    - ETHUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false              # Dezactivat — pierde pe piata actuala
  timeframe: "H1"
  symbols: ["EURUSD.cfd"]
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: ["EURUSD.cfd"]
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
