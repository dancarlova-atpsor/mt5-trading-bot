# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: false   # DEZACTIVAT 2026-05-26 — stress test arata TF slab pe oil
  timeframe: "H1"
  symbols: []
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14

breakout:
  enabled: true
  timeframe: "M30"    # Default TF pentru simbolurile fara override
  # PORTOFOLIU 2026-07-01: BRENT M30 + XAG H1 + COCOA H1
  # symbol_tf_overrides permite TF diferit per simbol (NOU 2026-07-01)
  symbols:
    - BRENT.cfd      # M30 (default) — 0.05 lot
    - XAGUSD.cfd     # H1 (override) — 0.01 lot, +$584/luna estimat
    - COCOA.cfd      # H1 (override) — 0.02 lot, WR 70%!
  symbol_tf_overrides:
    XAGUSD.cfd: "H1"
    COCOA.cfd: "H1"
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 1.5

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: true
  timeframe: "H1"     # Default TF pentru simbolurile fara override
  # PORTOFOLIU 2026-07-01: XAU H1 + BRENT H1 + XPT/XPD/WTI/BNB M30
  symbols:
    - XAUUSD.cfd     # H1 (default) — 0.01 lot, ~$145/luna
    - BRENT.cfd      # H1 (default) — 0.05 lot
    - XPTUSD.cfd     # M30 (override) — 0.02 lot, ~$219/luna
    - XPDUSD.cfd     # M30 (override) — 0.02 lot, ~$140/luna
    - WTI.cfd        # M30 (override) — 0.05 lot, ~$142/luna
    # BNBUSD.cfd SCOS 2026-07-06 — -$163 in 24h (weekend hold + calibrator lot 0.07)
  symbol_tf_overrides:
    XPTUSD.cfd: "M30"
    XPDUSD.cfd: "M30"
    WTI.cfd: "M30"
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
