# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # CONFIG HIBRID + STOCKS (2026-05-07): forex/metals + 7 stocks profitabile
  # Backtest 90d estimat: $48-69/zi
  symbols:
    # Forex/metals (4)
    - XAUUSD.cfd     # SELL only (filter swap), R:R 3.0
    - USDCHF.cfd     # R:R 3.0 (status quo)
    - USDCAD.cfd     # R:R 1.5 + filtru D1
    - XAGUSD.cfd     # REACTIVAT, R:R 1.5, lot fix 0.01
    # Stocks US (7) — backtest 90d toate profitabile
    - NFLX.cfd       # +$300 (R:R 3.0, WR 57%)
    - INTC.cfd       # +$293 (R:R 3.0, WR 50%)
    - GOOGL.cfd      # +$284 (R:R 3.0, WR 39%)
    - AMD.cfd        # +$269 (R:R 1.5, WR 63%)
    - ORCL.cfd       # +$211 (R:R 3.0, WR 50%)
    - MSFT.cfd       # +$165 (R:R 3.0, WR 40%)
    - AMZN.cfd       # +$149 (R:R 3.0, WR 33%)
  # Defaults (folosit daca simbolul nu are override)
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14
  # Override per simbol
  symbol_overrides:
    # === FOREX / METALS ===
    AUDUSD.cfd:
      ema_fast: 15
      ema_slow: 70
    EURGBP.cfd:
      ema_fast: 15
      ema_slow: 70
      adx_threshold: 30
    XAUUSD.cfd:
      ema_fast: 10
      ema_slow: 70
      adx_threshold: 30
    USDCHF.cfd:
      ema_fast: 10
      ema_slow: 30
    USDCAD.cfd:
      ema_fast: 15
      ema_slow: 70
      adx_threshold: 18
      d1_filter: true        # NOU: filter D1 trend (din backtest D1 filter ajuta DOAR aici)
    XAGUSD.cfd:
      ema_fast: 20
      ema_slow: 50
      adx_threshold: 25
    # === STOCKS (parametri default 20/50/25 OK din backtest) ===
    AMD.cfd:
      ema_fast: 20
      ema_slow: 50
      adx_threshold: 25

breakout:
  enabled: true
  timeframe: "H1"
  # CONFIG REAL 5300 EUR — 4 simboluri (mai putin EURUSD, AUDUSD, EURGBP)
  symbols:
    - GBPUSD.cfd     # Breakout +$2149 backtest 90d
    - XAUUSD.cfd     # SELL only via filter
    - USDCHF.cfd
    - USDCAD.cfd
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 2.0         # OPTIMIZAT (era 1.2)

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false
  timeframe: "H1"
  symbols: []
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
