# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # Backtest 90d (2026-04-17): EMA 20/50 ADX 25 RR 3.0 este optim
  # XAGUSD SCOS (ATR 0.6 vs SL 0.15 = disaster), GBPUSD SCOS (-$1846 in backtest)
  # NOI: XAUUSD (+$12133!), USDCHF (+$2582), USDCAD (+$1495)
  symbols:
    - EURUSD.cfd     # +$4671
    - AUDUSD.cfd     # +$2584
    - EURGBP.cfd     # +$740
    - XAUUSD.cfd     # +$12133 ← TOP performer
    - USDCHF.cfd     # +$2582
    - USDCAD.cfd     # +$1495
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14

breakout:
  enabled: true
  timeframe: "H1"
  # Backtest 90d: GBPUSD +$2149 (WR 40% PF 2.20), EURUSD +$1584 (WR 44% PF 2.18)
  symbols:
    - GBPUSD.cfd
    - EURUSD.cfd
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 2.0         # OPTIMIZAT (era 1.2)

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false
  timeframe: "H1"
  symbols: []
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
