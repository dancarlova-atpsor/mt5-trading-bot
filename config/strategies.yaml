# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # CONFIG METAL-ONLY (2026-05-18) — review saptamana 11-15 mai post-deploy:
  # Metale +$80 (80% WR) — singurele profitabile pe demo real.
  # Stocks/forex au pierdut: scoase.
  symbols:
    - XAUUSD.cfd     # SELL only (filter swap), R:R 3.0
    - XAGUSD.cfd     # R:R 1.5, lot fix 0.01
  # Defaults (folosit daca simbolul nu are override)
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14
  # Override per simbol
  symbol_overrides:
    XAUUSD.cfd:
      ema_fast: 10
      ema_slow: 70
      adx_threshold: 30
    XAGUSD.cfd:
      ema_fast: 20
      ema_slow: 50
      adx_threshold: 25

breakout:
  enabled: true
  timeframe: "H1"
  # CONFIG METAL-ONLY (2026-05-18) — scos USDCHF/USDCAD/GBPUSD (perdere in saptamana real)
  # Pastram XAU pentru breakout pe trenduri puternice
  symbols:
    - XAUUSD.cfd     # SELL only via swap filter, breakout pe trenduri puternice
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 2.0

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false
  timeframe: "H1"
  symbols: []
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
