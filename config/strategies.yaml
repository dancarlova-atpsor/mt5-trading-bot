# ============================================
# Parametri per Strategie
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  symbols: ["EURUSD.cfd", "GBPUSD.cfd", "XAUUSD.cfd", "XAGUSD.cfd"]
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25        # ADX minim pentru trend puternic
  adx_period: 14

mean_reversion:
  enabled: true
  timeframe: "H1"
  symbols: ["EURUSD.cfd", "GBPUSD.cfd"]
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0
  volume_confirm: true      # Confirmare volum

news_sentiment:
  enabled: true
  timeframe: "H1"
  symbols: ["EURUSD.cfd", "GBPUSD.cfd", "XAUUSD.cfd", "XAGUSD.cfd"]
  min_articles: 3               # Minim articole pt semnal
  min_score: 0.3                # Scor minim sentiment

scalping:
  enabled: false
  timeframe: "M5"
  symbols: ["EURUSD.cfd"]
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15     # Spread maxim acceptat
  vwap_period: 20
