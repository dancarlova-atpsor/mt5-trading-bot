# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # Grid search 2026-04-21: parametri optimi DIFERITI per simbol.
  # Total 90d: +$1463 uniform -> +$7238 per-symbol. Imbunatatire +$5775.
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - EURGBP.cfd
    - XAUUSD.cfd
    - USDCHF.cfd
    - USDCAD.cfd
  # Defaults (folosit daca simbolul nu are override)
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14
  # Override per simbol (din grid search) - DOAR parametrii care difera de default
  symbol_overrides:
    # EURUSD.cfd: default 20/50/25 deja optim
    AUDUSD.cfd:
      ema_fast: 15
      ema_slow: 70      # Best +$167 vs +$108 default
    EURGBP.cfd:
      ema_fast: 15
      ema_slow: 70
      adx_threshold: 30  # Best +$130 vs +$80
    XAUUSD.cfd:
      ema_fast: 10
      ema_slow: 70
      adx_threshold: 30  # Best +$5598! vs +$655 — cea mai mare imbunatatire
    USDCHF.cfd:
      ema_fast: 10
      ema_slow: 30       # Best +$185 vs +$93
    USDCAD.cfd:
      ema_fast: 15
      ema_slow: 70
      adx_threshold: 18  # Best +$736 vs +$105 — ADX mai relaxat

breakout:
  enabled: true
  timeframe: "H1"
  # Extins pe toate simbolurile (2026-04-21) pentru a prinde breakout-uri din RANGING
  # Backtest confirma: GBPUSD +$2149, EURUSD +$1584 pe 90 zile
  # Pe XAUUSD, USDCAD, USDCHF breakout prinde move-uri mari dupa consolidare
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
    - XAUUSD.cfd
    - USDCHF.cfd
    - USDCAD.cfd
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 2.0         # OPTIMIZAT (era 1.2)

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false
  timeframe: "H1"
  symbols: []
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
