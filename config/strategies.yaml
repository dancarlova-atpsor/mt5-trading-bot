# ═══════════════════════════════════════════════════════════════════════
# STRATEGIA PRINCIPALA — ZONE BASED (2026-08-03)
# Zone tehnice hardcoded per simbol pe baza analiza chart D1+H4
# 4 metale post-crash BASING (XAG/XAU/XPT/XPD) + 3 recovery TREND (BRENT/WTI/COCOA)
# ═══════════════════════════════════════════════════════════════════════

zone_based:
  enabled: true
  timeframe: "H4"    # H4 pentru toate — filtreaza noise-ul H1/M30
  rsi_period: 14
  symbols:
    - XAGUSD.cfd
    - XAUUSD.cfd
    - XPTUSD.cfd
    - XPDUSD.cfd
    - BRENT.cfd
    - WTI.cfd
    - COCOA.cfd

  # ─────────────────────────────────────────────────────────────────
  # ZONE per simbol (analiza chart 2026-08-03)
  # ─────────────────────────────────────────────────────────────────
  zones:

    # ═══ CATEGORIE A: METALE post-crash BASING ═══

    XAGUSD.cfd:
      # Argint — Range 55-62 dupa crash mai (-37%)
      buy_zone: [54.50, 55.50]
      sell_zone: [60.00, 62.00]
      dead_zone: [56.50, 59.50]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 62.50
      breakout_down: 53.50
      buy_sl: 53.80
      sell_sl: 62.80
      buy_tp: 58.00
      sell_tp: 58.00

    XAUUSD.cfd:
      # Aur — Range 3900-4200 dupa crash feb-iun (-29%)
      buy_zone: [3990, 4020]
      sell_zone: [4110, 4150]
      dead_zone: [4030, 4100]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 4210
      breakout_down: 3890
      buy_sl: 3970
      sell_sl: 4165
      buy_tp: 4055
      sell_tp: 4055

    XPTUSD.cfd:
      # Platina — Range 1540-1720 dupa crash apr-iun (-26%)
      buy_zone: [1560, 1600]
      sell_zone: [1680, 1710]
      dead_zone: [1610, 1675]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 1725
      breakout_down: 1530
      buy_sl: 1540
      sell_sl: 1730
      buy_tp: 1640
      sell_tp: 1640

    XPDUSD.cfd:
      # Paladiu — Range 1150-1340 dupa crash apr-iun (-28%)
      buy_zone: [1180, 1220]
      sell_zone: [1300, 1330]
      dead_zone: [1240, 1290]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 1345
      breakout_down: 1145
      buy_sl: 1150
      sell_sl: 1350
      buy_tp: 1265
      sell_tp: 1265

    # ═══ CATEGORIE B: OIL + COCOA recovery TREND ═══

    BRENT.cfd:
      # Petrol UK — Fund 67 (iun) → rally 95 (24 iul) → pullback 83
      buy_zone: [80.00, 82.00]
      sell_zone: [88.00, 92.00]
      dead_zone: [82.50, 87.50]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 95.50
      breakout_down: 79.00
      buy_sl: 78.50
      sell_sl: 92.50
      buy_tp: 88.00
      sell_tp: 82.00

    WTI.cfd:
      # Petrol US — Fund 68 (iun) → rally 92 (21 iul) → pullback 78
      buy_zone: [72.00, 74.00]
      sell_zone: [85.00, 88.00]
      dead_zone: [75.00, 84.00]
      rsi_buy_max: 40
      rsi_sell_min: 60
      breakout_up: 92.50
      breakout_down: 71.50
      buy_sl: 70.00
      sell_sl: 89.50
      buy_tp: 80.00
      sell_tp: 78.00

    COCOA.cfd:
      # Cacao — Rally masiv (+68%) → pullback 6400 → 5400
      buy_zone: [5100, 5300]
      sell_zone: [6100, 6300]
