# ═══════════════════════════════════════════════════════════════════════
# STRATEGIA PRINCIPALA — ZONE BASED (2026-08-03)
# Zone tehnice hardcoded per simbol pe baza analiza chart D1+H4
# 4 metale post-crash BASING (XAG/XAU/XPT/XPD) + 3 recovery TREND (BRENT/WTI/COCOA)
# ═══════════════════════════════════════════════════════════════════════

zone_based:
  enabled: true
  timeframe: "H4"    # H4 pentru toate — filtreaza noise-ul H1/M30
  rsi_period: 14
  symbols:
    - XAGUSD.cfd
    - XAUUSD.cfd
    - XPTUSD.cfd
    - XPDUSD.cfd
    - BRENT.cfd
    - WTI.cfd
    - COCOA.cfd

  # ─────────────────────────────────────────────────────────────────
  # ZONE per simbol (analiza chart 2026-08-03)
  # ─────────────────────────────────────────────────────────────────
  zones:

    # ═══ CATEGORIE A: METALE post-crash BASING ═══

    # REVERT SAFE 2026-08-05 — dupa dezastru 04.08 (-$591 in 24h, 12 trade-uri cascade)
    # Zone STRICTE inapoi + RSI EXTREM 40/60 (nu moderat 45/55)
    # + max_open_positions 3 (nu 8) in risk_management.yaml
    # + SuperBot multiplier DEZACTIVAT pentru zone_based
    # + Fallback hard-fail daca zone_sl lipseste (nu ATR-based)
    #
    # Filosofie: prefer 0-1 trade/zi CORECT decat 10 trade cascade

    XAGUSD.cfd:
      # Argint — Range 55-62
      buy_zone: [54.50, 55.50]
      sell_zone: [60.50, 62.00]
      dead_zone: [56.00, 60.00]     # LARG — evita majoritatea zonei
      rsi_buy_max: 35               # STRICT (era 45)
      rsi_sell_min: 65              # STRICT (era 55)
      breakout_up: 62.50
      breakout_down: 53.50
      buy_sl: 53.80
      sell_sl: 62.80
      buy_tp: 58.00
      sell_tp: 58.00

    XAUUSD.cfd:
      # Aur — Range 3900-4200
      buy_zone: [3980, 4020]
      sell_zone: [4130, 4160]
      dead_zone: [4025, 4125]
      rsi_buy_max: 35
      rsi_sell_min: 65
      breakout_up: 4210
      breakout_down: 3890
      buy_sl: 3960
      sell_sl: 4180
      buy_tp: 4070
      sell_tp: 4070

    XPTUSD.cfd:
      # Platina — Range 1540-1720
      buy_zone: [1550, 1590]
      sell_zone: [1690, 1720]
      dead_zone: [1595, 1685]
      rsi_buy_max: 35
      rsi_sell_min: 65
      breakout_up: 1725
      breakout_down: 1530
      buy_sl: 1535
      sell_sl: 1735
      buy_tp: 1640
      sell_tp: 1640

    XPDUSD.cfd:
      # Paladiu — Range 1150-1340
      buy_zone: [1170, 1210]
      sell_zone: [1310, 1340]
      dead_zone: [1215, 1305]
      rsi_buy_max: 35
      rsi_sell_min: 65
      breakout_up: 1345
      breakout_down: 1145
      buy_sl: 1145
      sell_sl: 1355
      buy_tp: 1260
      sell_tp: 1260

    # ═══ CATEGORIE B: OIL + COCOA recovery TREND ═══

    BRENT.cfd:
      buy_zone: [78.00, 80.50]
      sell_zone: [89.00, 92.00]
      dead_zone: [81.00, 88.50]     # LARG
      rsi_buy_max: 35
      rsi_sell_min: 65
      breakout_up: 95.50
      breakout_down: 77.00
      buy_sl: 76.50
      sell_sl: 93.50
      buy_tp: 84.00
      sell_tp: 84.00

    WTI.cfd:
