# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: false   # DEZACTIVAT 2026-05-26 — stress test arata TF slab pe oil
  timeframe: "H1"
  symbols: []
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14

breakout:
  enabled: true
  timeframe: "M15"    # SCHIMBAT din H1 in M15 — stress test confirma M15 optim pe oil
  # CONFIG OIL-ONLY (2026-05-26):
  # BRENT Breakout M15 lot 0.08 = +$12/zi
  # WTI Breakout M15 lot 0.07 = +$8.5/zi
  symbols:
    - BRENT.cfd      # Lot 0.08 (vezi volume_overrides in risk_management.yaml)
    - WTI.cfd        # Lot 0.07
  lookback_period: 50
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 1.5    # Relaxat de la 2.0 (M15 are vol mai mic decat H1)

macd_divergence:
  enabled: false             # Dezactivat 2026-04-17: backtest arata 0-1 trade pe simbol, pierdere
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: false             # Dezactivat 2026-04-17: sentiment a dus la pierderi overnight
  timeframe: "H1"
  symbols:
    - EURUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: true       # ACTIVAT 2026-05-26 — best performer din stress test
  timeframe: "H1"
  # CONFIG OIL-ONLY:
  # BRENT MeanReversion H1 lot 0.08 = +$17/zi (cel mai profitabil din toate!)
  # WTI nu este in mean_reversion (Breakout e mai bun)
  symbols:
    - BRENT.cfd       # Lot 0.08 (R:R 2.0 default din risk_management.yaml)
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
