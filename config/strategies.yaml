# ============================================
# Parametri per Strategie — TOP 5 ales dupa grid search
# ============================================

trend_following:
  enabled: true
  timeframe: "H1"
  # Grid search a confirmat: EMA 20/50 ADX 25 e optim pe EURUSD, AUDUSD
  # EURGBP include ca diversificare (TF PF 1.08 pe 3 luni)
  # XAGUSD include din istoric real 95.8% win rate
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - EURGBP.cfd
    - XAGUSD.cfd
  ema_fast: 20
  ema_slow: 50
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  adx_threshold: 25
  adx_period: 14

breakout:
  enabled: true
  timeframe: "H1"
  # Grid search: Breakout LB50 Vol2.0 → GBPUSD PF 1.59 (cel mai bun!)
  symbols:
    - GBPUSD.cfd
  lookback_period: 50        # OPTIMIZAT (era 20)
  atr_period: 14
  min_atr_ratio: 0.8
  min_vol_ratio: 2.0         # OPTIMIZAT (era 1.2)

macd_divergence:
  enabled: true              # Reactivat cu parametri RELAXATI pentru mai multe semnale
  timeframe: "H1"
  # Pe simbolurile TOP 5 (complementar cu TrendFollowing/Breakout)
  symbols:
    - EURUSD.cfd
    - AUDUSD.cfd
    - GBPUSD.cfd
    - EURGBP.cfd
    - XAGUSD.cfd
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  rsi_period: 14
  rsi_oversold: 35           # RELAXAT (era 40)
  rsi_overbought: 65         # RELAXAT (era 60)
  divergence_lookback: 25    # RELAXAT (era 30) — divergente mai recente

news_sentiment:
  enabled: true
  timeframe: "H1"
  # Confirmare secundara pe TOP 5
  symbols:
    - EURUSD.cfd
    - GBPUSD.cfd
    - XAGUSD.cfd
  min_articles: 3
  min_score: 0.3

mean_reversion:
  enabled: false
  timeframe: "H1"
  symbols: []
  rsi_period: 14
  rsi_oversold: 30
  rsi_overbought: 70
  bb_period: 20
  bb_std_dev: 2.0

scalping:
  enabled: false
  timeframe: "M5"
  symbols: []
  stochastic_k: 14
  stochastic_d: 3
  stochastic_smooth: 3
  stochastic_oversold: 20
  stochastic_overbought: 80
  max_spread_points: 15
  vwap_period: 20
